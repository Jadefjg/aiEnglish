services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aienglish
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes: ["mysql_data:/var/lib/mysql", "./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /srv
    volumes: ["./backend:/srv/backend", "./requirements.txt:/srv/requirements.txt", "../asset:/srv/asset"]
    expose: ["8000"]
    environment:
      ASSET_DIR: /srv/asset
      MYSQL_HOST: mysql
      MYSQL_DATABASE: aienglish
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENVIRONMENT: production
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
  migrate:
    image: mysql:8.4
    volumes: ["./db/migrations:/migrations:ro"]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    entrypoint: ["sh", "-c"]
    command: ["until mysql -h mysql -uroot -e 'SELECT 1' aienglish; do sleep 2; done; for f in /migrations/*.sql; do mysql -h mysql -uroot aienglish < \"$$f\"; done"]
    depends_on:
      mysql:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mysql_data:
