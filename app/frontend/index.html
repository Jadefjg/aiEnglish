<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>领智云英语教程中心</title><script src="/vendor/vue.global.prod.js"></script><style>
:root{--blue:#2457e6;--navy:#15213b;--green:#168669;--line:#e5e9f1;--muted:#667085;--bg:#f6f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}.shell{max-width:1180px;margin:auto;padding:0 22px}.top{height:66px;background:#fff;border-bottom:1px solid var(--line)}.top .shell{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.logo{width:34px;height:34px;background:var(--blue);color:#fff;display:grid;place-items:center;border-radius:8px}.hero{background:#17254a;color:#fff;padding:42px 0 64px}.hero h1{font-size:34px;margin:0 0 10px}.hero p{margin:0;color:#cbd4ef}.main{margin-top:-28px;padding-bottom:48px}.summary{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:8px}.metric{padding:20px 24px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric b{display:block;font-size:25px;color:var(--blue);margin-bottom:4px}.metric span{font-size:13px;color:var(--muted)}.controls{display:flex;justify-content:space-between;align-items:center;margin:28px 0 18px;gap:14px}.tabs{display:flex;border-bottom:1px solid var(--line);gap:24px}.tabs button{background:none;border:0;padding:12px 2px;color:var(--muted);font-size:15px;cursor:pointer}.tabs button.on{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:700}.search{width:310px;border:1px solid var(--line);background:#fff;padding:11px 14px;border-radius:6px;outline:none}.filters{display:flex;gap:8px;margin-bottom:18px}.filters button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 13px;color:var(--muted);cursor:pointer}.filters button.on{background:#eaf0ff;border-color:#b8c8fa;color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;min-height:150px;display:flex;flex-direction:column}.card:hover{border-color:#b8c8fa}.eyebrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.role{color:var(--green);font-weight:700}.card h3{font-size:17px;margin:14px 0 7px}.card p{font-size:13px;color:var(--muted);line-height:1.65;margin:0 0 15px}.action{margin-top:auto;color:var(--blue);font-size:13px;text-decoration:none}.media-card{padding:0;overflow:hidden}.thumb{height:118px;background:#e9eefb;display:grid;place-items:center;color:var(--blue);font-size:30px}.inner{padding:15px;display:flex;flex:1;flex-direction:column}.error,.empty{padding:45px;text-align:center;color:var(--muted);grid-column:1/-1}.loading{opacity:.55}.foot{border-top:1px solid var(--line);padding:20px;text-align:center;color:#98a2b3;font-size:12px}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}.controls{align-items:stretch;flex-direction:column}.search{width:100%}.hero h1{font-size:27px}}
</style></head><body><div id="app"><nav class="top"><div class="shell"><div class="brand"><span class="logo">英</span>领智云英语</div><span>教程中心</span></div></nav><header class="hero"><div class="shell"><h1>学习与教学操作指南</h1><p>依据学生端与教师端官方手册整理，集中查阅功能流程、视频和图文资料。</p></div></header><main class="shell main"><section class="summary"><div class="metric"><b>{{stats.features||0}}</b><span>功能指南</span></div><div class="metric"><b>{{stats.student_features||0}}</b><span>学生端功能</span></div><div class="metric"><b>{{stats.teacher_features||0}}</b><span>教师端功能</span></div><div class="metric"><b>{{stats.videos||0}} + {{stats.manuals||0}}</b><span>视频与手册</span></div></section><div class="controls"><div class="tabs"><button :class="{on:view==='features'}" @click="switchView('features')">功能指南</button><button :class="{on:view==='resources'}" @click="switchView('resources')">素材资源</button></div><input class="search" v-model="q" @input="load" placeholder="搜索功能或资源"></div><div class="filters"><button v-for="item in filters" :key="item.key" :class="{on:role===item.key}" @click="role=item.key;load()">{{item.label}}</button></div><section class="grid" :class="{loading}"><template v-if="view==='features'"><article class="card" v-for="item in items" :key="item.id"><div class="eyebrow"><span class="role">{{item.role==='student'?'学生端':'教师端'}}</span><span>手册第 {{item.pages}} 页</span></div><h3>{{String(item.id).padStart(2,'0')}} · {{item.title}}</h3><p>{{item.description}}</p><a v-if="item.resources.length" class="action" :href="item.resources[0].url" target="_blank">播放关联视频（{{item.resources.length}}）→</a><a v-else class="action" :href="manualUrl(item.role)" target="_blank">查看对应手册 →</a></article></template><template v-else><article class="card media-card" v-for="item in items" :key="item.id"><div class="thumb">{{item.type==='mp4'?'▶':'▤'}}</div><div class="inner"><div class="eyebrow"><span>{{item.type==='mp4'?'视频教程':'PDF 手册'}}{{item.duplicate_of?' · 重复项':''}}</span><span>{{formatSize(item.size)}}</span></div><h3>{{item.title}}</h3><p>{{item.summary}}<template v-if="item.duration"> · {{formatTime(item.duration)}}</template></p><a class="action" :href="item.url" target="_blank">{{item.type==='mp4'?'播放视频':'打开文档'}} →</a></div></article></template><div v-if="error" class="error">{{error}}</div><div v-else-if="!items.length&&!loading" class="empty">没有找到匹配内容</div></section></main><footer class="foot">领智云英语 · 教程资料统一管理</footer></div><script>
const{createApp}=Vue;createApp({data:()=>({stats:{},items:[],view:'features',role:'all',q:'',loading:false,error:'',filters:[{key:'all',label:'全部'},{key:'student',label:'学生端'},{key:'teacher',label:'教师端'}],manuals:{}}),mounted(){this.init()},methods:{async init(){try{this.stats=await fetch('/api/stats').then(this.ok);const media=await fetch('/api/resources?kind=pdf').then(this.ok);media.items.forEach(x=>this.manuals[x.role]=x.url);await this.load()}catch(e){this.error='服务暂时不可用，请稍后重试。'}},ok(r){if(!r.ok)throw Error(r.status);return r.json()},async load(){this.loading=true;this.error='';try{const endpoint=this.view==='features'?'features':'resources';const data=await fetch(`/api/${endpoint}?role=${this.role}&q=${encodeURIComponent(this.q)}`).then(this.ok);this.items=data.items}catch(e){this.error='内容加载失败。'}finally{this.loading=false}},switchView(v){this.view=v;this.role='all';this.q='';this.load()},manualUrl(role){return this.manuals[role]||'#'},formatSize(n){return n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB'},formatTime(n){return Math.floor(n/60)+'分'+String(n%60).padStart(2,'0')+'秒'}}}).mount('#app')
</script><script src="/auth.js"></script></body></html>
