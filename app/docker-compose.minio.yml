# Optional shared object storage for multi-replica API.
# Usage: docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes: ["minio_data:/data"]
    ports: ["9000:9000", "9001:9001"]
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-42-27Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin}; do sleep 2; done;
      mc mb -p local/$${S3_BUCKET:-aienglish-uploads} || true;
      mc anonymous set none local/$${S3_BUCKET:-aienglish-uploads} || true;
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-aienglish-uploads}
  api:
    environment:
      STORAGE_BACKEND: minio
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-aienglish-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PRESIGN: ${S3_PRESIGN:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
volumes:
  minio_data:
